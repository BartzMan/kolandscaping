name: Deploy preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build:pages
      - name: Prepare Pages folder
        run: |
          echo "=== dist ==="
          find dist -maxdepth 3 | head -80
          if [ -f dist/index.html ]; then
            true
          elif [ -f dist/_shell.html ]; then
            cp dist/_shell.html dist/index.html
          elif [ -f dist/client/index.html ]; then
            cp -a dist/client/. dist/
          else
            echo "Cannot find a shell HTML"
            exit 1
          fi
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
