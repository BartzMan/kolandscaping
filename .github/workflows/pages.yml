name: Deploy preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build:pages
      - name: Find static output
        run: |
          if [ -f dist/index.html ]; then echo "OUT=dist" >> $GITHUB_ENV
          elif [ -f .output/public/index.html ]; then echo "OUT=.output/public" >> $GITHUB_ENV
          else
            echo "No index.html"; find . -name index.html -not -path './node_modules/*' | head
            ls -la
            exit 1
          fi
      - name: SPA fallback for GitHub Pages
        run: cp "$OUT/index.html" "$OUT/404.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
